services:
  # Note: If you are assigning a custom name to your db service on the line below, make sure it does not contain underscores

  # application database
  app_db:
    image: 'postgres:latest'
    environment:
      POSTGRES_USER: dumi_user
      POSTGRES_PASSWORD: dumi_password
      POSTGRES_DB: dumi_db
    ports:
      - 5433:5432
    networks:
      - app_network
    restart: no

  # supertokens core database
  db:
    image: 'postgres:latest'
    environment:
      POSTGRES_USER: dumi_super_token_user
      POSTGRES_PASSWORD: dumi_password
      POSTGRES_DB: supertokens
    ports:
      - 5432:5432
    networks:
      - app_network
    restart: no
    healthcheck:
      test:
        [
          'CMD',
          'pg_isready',
          '-U',
          'dumi_super_token_user',
          '-d',
          'supertokens',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 3567:3567
    environment:
      POSTGRESQL_CONNECTION_URI: 'postgresql://dumi_super_token_user:dumi_password@db:5432/supertokens'
      API_KEYS: ${API_KEY}
    networks:
      - app_network
    restart: no
    healthcheck:
      test: >
        bash -c 'exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e "GET /hello HTTP/1.1\r\nhost: 127.0.0.1:3567\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep "Hello"'
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app_network:
    driver: bridge
